name: test

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Unit tests
              run: node --test tests/*.test.js
            - name: Syntax check
              run: |
                  for f in extension/*.js extension/content/*.js tests/*.js; do
                      node --check "$f"
                  done
            - name: JSON syntax
              run: |
                  for f in extension/manifest.json extension/rules.json; do
                      node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
                  done
